services:
  - type: web
    name: stockflow-app
    env: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm --prefix server run prisma:generate && npm run build
    startCommand: npm --prefix server run prisma:deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
